[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# App de una sola página: rutas como /unirse/CODIGO las resuelve React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker y el manifest no se cachean, así las actualizaciones llegan enseguida
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
